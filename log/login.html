<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoolAi - الدخول</title><link rel="icon" href="../img/fav.png"><script src="../core/theme.js"></script><link rel="stylesheet" href="../core/base.css"><link rel="stylesheet" href="login.css"></head><body>
<div class="auth"><div class="card"><div class="row" style="justify-content:space-between"><a class="brand" href="../"><img src="../img/logo.png" alt="">CoolAi</a><button class="icon-btn" onclick="toggleTheme()" aria-label="theme"><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
<div class="tabs"><button id="t-login" class="on">دخول</button><button id="t-signup">حساب جديد</button></div>
<form id="f" novalidate><div class="field" id="g-name" hidden><label>الاسم</label><input id="name" maxlength="40" autocomplete="name"></div>
<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" dir="ltr"></div>
<div class="field"><label>كلمة السر</label><input id="password" type="password" autocomplete="current-password" dir="ltr"></div>
<div class="field" id="g-code" hidden><label>كود الدعوة (اختياري)</label><input id="invite" maxlength="12" dir="ltr"></div>
<div id="ts" style="margin-bottom:1rem"></div><div class="err" id="err"></div><button class="btn primary block" id="go">دخول</button></form></div></div>
<script src="../core/config.js"></script><script src="../core/api.js"></script><script src="login.js"></script></body></html>
